name: Motordil Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: motordil-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar publicaciones y notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node motordil_telegram_bot.js

      - name: Guardar estado de publicaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- motordil_state.json; then
            echo "No hay cambios de estado para guardar."
            exit 0
          fi
          git add motordil_state.json
          git commit -m "chore: actualizar estado de Motordil"
          git push
